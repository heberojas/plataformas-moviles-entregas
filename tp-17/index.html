<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recorriendo Argentina</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="encabezado text-center">
    <h1>Recorriendo Argentina</h1>
    <p>Elegí una provincia y conocé sus municipios</p>
  </header>
  <main class="container py-4">
   
    <section class="panel">
      <label for="provincias" class="form-label">Provincia</label>
      <select id="provincias" class="form-select">
        <option>Cargando provincias...</option>
      </select>
    </section>

    <p id="mensaje" class="mensaje text-center"></p>

    <div class="row g-3" id="municipios"></div>
  </main>

  <footer class="pie text-center">
    Proyecto de Plataformas Móviles · Datos de la API Georef Argentina
  </footer>
  <script src="script.js"></script>
</body>
</html>
